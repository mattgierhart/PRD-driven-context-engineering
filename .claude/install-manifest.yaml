# Install Manifest — PRD-Driven Context Engineering
#
# The single source of truth for what the source-run installer places into a target
# repo, what plugin init seeds, and what both paths must NEVER touch. Consumer repos do
# not receive the installer, this manifest, or either install operator; installs and
# upgrades are always run from a trusted methodology source checkout.
#
# Flat contract sections:
#   framework     — methodology engine. Installed on first run, UPDATED on re-run
#                   (with --force when a file has local drift). Framework-owned files are
#                   refreshed in place; unrelated consumer additions in owned dirs survive.
#   template_seed — seeded ONCE, then product-owned. Never overwritten if present.
#                   Form: "<src>" (copy in place) or "<src> -> <dest>" (rename).
#   never_touch   — pure product destinations. They may be created by an initial
#                   template seed, but the installer never overwrites them afterward.
#                   Framework entries must remain disjoint from this class.
#   direct_exclude — authoring/plugin-only children omitted from direct runtime copies.
#   plugin_review_alias — plugin-only, read-only views generated from mapped seed sources
#                         so live documentation links resolve. They are never installer inputs.
#   obsolete_framework_scan_roots — generic framework namespaces checked during upgrades.
#   obsolete_framework_fingerprints — SHA-256 of exact retired repository-relative paths,
#                        removed only by direct `--force`. Hashes keep excluded maintainer
#                        filenames out of the reusable manifest.
#
# Parsing contract (keep flat): each section is a top-level YAML key whose value is
# a list of `- <path>` items. install.sh extracts items with awk; do not nest.

version: "3.3.0"

framework:
  - CLAUDE.md
  - README_template.md             # inert local template reference; not install authority
  - PRD_template.md                # inert generic reference; root PRD.md is repository authority
  - SoT_template                   # inert generic reference; root SoT/ is repository authority
  - .claude/VERSION
  - .claude/README.md
  - .claude/settings.json          # special-cased: merged, never blind-overwritten
  - .claude/rules
  - .claude/hooks
  - .claude/skills
  - .claude/agents/devlab/AGENT.md
  - .claude/agents/horizon/AGENT.md
  - .claude/agents/metro/AGENT.md
  - .claude/agents/studio/AGENT.md
  - scripts/_readiness
  - scripts/asof.py
  - scripts/compute-prd-readiness.py
  - scripts/compute-readiness.py
  - scripts/compute-sot-readiness.py
  - scripts/generate-id-pattern.sh
  - scripts/prd-ce-init.sh         # plugin-only initializer; omitted from direct runtime
  - scripts/readiness.py
  - scripts/requirements.txt
  - scripts/validate-edges.py
  - scripts/validate-ids.sh

direct_exclude:
  - .claude/hooks/stage-gate-validation.md # maintainer concept note; not an integrated runtime hook
  - .claude/skills/init            # plugin-native initializer; direct install already initialized
  - .claude/skills/ghm-self-install # source-checkout operator; consumers are not distributors
  - .claude/skills/ghm-template-sync # maintainer/source-layout updater; no upstream exists in consumers
  - .claude/skills/SKILL_TEMPLATE  # contributor template, not a runnable consumer skill
  - .claude/skills/README.md       # contributor index
  - .claude/skills/skills-inventory.md
  - scripts/prd-ce-init.sh         # plugin runtime only; direct installs are source-run

# Read-only aliases generated only inside the plugin's templates bundle. Live plugin rules link to
# the canonical doc names, while init still seeds from distinct `.seed` sources below.
plugin_review_alias:
  - docs/DEVELOPMENT_GRAPH.md
  - docs/READINESS_PROTOCOL.md
  - .claude/domain-profile.yaml

obsolete_framework_scan_roots:
  - .claude/hooks
  - .claude/skills
  - scripts
  - docs

