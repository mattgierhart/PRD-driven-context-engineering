template_seed:
  - README_template.md -> README.md
  - PRD_template.md -> PRD.md
  - epics/EPIC_TEMPLATE.seed.md -> epics/EPIC_TEMPLATE.md
  - epics/README.seed.md -> epics/README.md
  - SoT_template -> SoT
  - docs/DEVELOPMENT_GRAPH.seed.md -> docs/DEVELOPMENT_GRAPH.md # product-owned after seed
  - docs/READINESS_PROTOCOL.seed.md -> docs/READINESS_PROTOCOL.md # product-owned after seed
  - .claude/domain-profile.seed.yaml -> .claude/domain-profile.yaml
  - .claude/agents/devlab/MEMORY.seed.md -> .claude/agents/devlab/MEMORY.md
  - .claude/agents/horizon/MEMORY.seed.md -> .claude/agents/horizon/MEMORY.md
  - .claude/agents/metro/MEMORY.seed.md -> .claude/agents/metro/MEMORY.md
  - .claude/agents/studio/MEMORY.seed.md -> .claude/agents/studio/MEMORY.md

never_touch:
  - README.md                      # product dashboard (seeded once from template)
  - PRD.md                         # product requirements body
  - SoT                            # SoT entries are product knowledge
  - docs/DEVELOPMENT_GRAPH.md      # consumer copy may be annotated locally after initial seed
  - docs/READINESS_PROTOCOL.md     # consumer copy may be annotated locally after initial seed
  - epics/EPIC_TEMPLATE.md         # consumer may adapt its future epic scaffold
  - epics/README.md                # consumer-owned epic workflow guide
  - epics/EPIC-*.md                # closed/active work packages
  - .claude/domain-profile.yaml    # seeded once; downstream taxonomy/config is product-owned
  - .claude/agents/*/MEMORY.md     # agent memory is product-specific
  - .claude/projects
