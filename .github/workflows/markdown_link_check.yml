name: Markdown Links
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3

      - name: Check links in modified markdown (excluding generated plugin payload)
        # The committed plugin payload (plugins/prd-ce/**) is a generated artifact: its
        # copied skill references may be relocation-sensitive. Authored source is checked here;
        # tests/test_distribution.py separately checks the full direct install, plugin live
        # skills/rules, and plugin-native consumer scaffold. See package-plugin.sh.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if printf '%s' "$before" | grep -qE '^0+$'; then
              files=$(git ls-files '*.md' ':(exclude)plugins/prd-ce/**')
            else
              files=$(git diff --name-only "$before" "${{ github.sha }}" -- '*.md' ':(exclude)plugins/prd-ce/**')
            fi
          else
            base="${{ github.base_ref }}"
            git fetch origin "$base" --depth=1
            files=$(git diff --name-only "origin/$base...HEAD" -- '*.md' ':(exclude)plugins/prd-ce/**')
          fi
          if [ -z "$files" ]; then
            echo "No modified markdown outside the generated payload — nothing to check."
            exit 0
          fi
          echo "Checking:"; echo "$files"
          rc=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            markdown-link-check --quiet --config .github/mlc_config.json "$f" || rc=1
          done <<< "$files"
          exit $rc
