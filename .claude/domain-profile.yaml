# Domain Profile — PRD Led Context Engineering
# Defines the ID taxonomy, SoT file mapping, skill taxonomy, and agent registry.
# Derivatives customize this file for their domain.
#
# Profiles:
#   product        — Full PRD lifecycle (default)
#   library        — Open-source library development
#   infrastructure — Config management, DevOps, dotfiles
#   research       — Exploration-heavy, lighter process
#
# To adapt for a non-product repo:
#   1. Change `profile` to your domain type
#   2. Replace `id_prefixes` with your domain's taxonomy
#   3. Remove domain skills you don't need
#   4. Remove agents if role specialization doesn't apply

profile: product

# --- ID Prefix Registry ---
# Each prefix maps to a SoT file and description.
# Hooks and skills read from this section to resolve ID → file lookups.
id_prefixes:
  # SoT-owned IDs
  BR:   { file: "SoT/SoT.BUSINESS_RULES.md",       description: "Business rules & constraints" }
  UJ:   { file: "SoT/SoT.USER_JOURNEYS.md",         description: "User journeys" }
  PER:  { file: "SoT/SoT.USER_JOURNEYS.md",         description: "Personas" }
  SCR:  { file: "SoT/SoT.USER_JOURNEYS.md",         description: "Screens" }
  API:  { file: "SoT/SoT.API_CONTRACTS.md",          description: "API endpoints" }
  DBT:  { file: "SoT/SoT.DATA_MODEL.md",            description: "Database tables" }
  TEST: { file: "SoT/SoT.TESTING.md",               description: "Test cases" }
  DEP:  { file: "SoT/SoT.DEPLOYMENT.md",            description: "Deployment steps" }
  RUN:  { file: "SoT/SoT.DEPLOYMENT.md",            description: "Runbooks" }
  MON:  { file: "SoT/SoT.DEPLOYMENT.md",            description: "Monitoring rules" }
  CFD:  { file: "SoT/SoT.customer_feedback.md",     description: "Customer feedback" }
  DES:  { file: "SoT/SoT.DESIGN_COMPONENTS.md",     description: "Design components" }
  TECH: { file: "SoT/SoT.TECHNICAL_DECISIONS.md",   description: "Tech stack decisions" }
  ARC:  { file: "SoT/SoT.TECHNICAL_DECISIONS.md",   description: "Architecture decisions" }
  INT:  { file: "SoT/SoT.INTEGRATIONS.md",          description: "Integrations" }
  LL:   { file: "SoT/SoT.LESSONS_LEARNED.md",       description: "Lessons learned (cross-session feedback)" }
  ADO:  { file: "SoT/SoT.ADOPTION.md",               description: "Adoption-stage data (Moore Chasm — stage, beachhead, whole-product, references)" }

  # PRD/README-owned IDs
  FEA:  { file: "PRD.md",    description: "Features (PRD-owned, v0.3)" }
  RISK: { file: "PRD.md",    description: "Risks (PRD-owned, v0.5)" }
  GTM:  { file: "PRD.md",    description: "Go-to-market (PRD-owned, v0.9 — Type sub-codes: Positioning, Offer, Guarantee, Channel, Sequence, Index, AEO, OUT, CHG, MOPS, CASE, TST)" }
  KPI:  { file: "README.md", description: "KPI metrics (README-owned)" }

  # Execution IDs
  EPIC: { file: "epics/",    description: "Execution work packages" }

# --- Development Graph: Code Node Types (v0.6→v0.7) ---
# The "as-built" layer of the knowledge graph. Unlike id_prefixes (hand-authored
# spec nodes), these are entities EXTRACTED from the product codebase during v0.7
# build execution — Graphify-style AST parsing, deterministic and free (no LLM).
# They are NOT ID-prefixed; their identity is `{parent_dir}_{file}_{symbol}`.
# See docs/DEVELOPMENT_GRAPH.md for the full schema (the HeartBeat data contract).
code_node_types:
  module:   { description: "A source file or package" }
  class:    { description: "A class / type / interface definition" }
  function: { description: "A function or method" }
  table:    { description: "A database table (from SQL DDL or ORM model)" }
  endpoint: { description: "An HTTP route / API handler" }

# --- Development Graph: Bridge Relations (v0.6→v0.7) ---
# Edges that connect the CODE layer to the SPEC (ID) layer. Harvested from the
# @implements / @see / @verifies traceability tags mandated by rule 04, plus
# TEST- references. These bridge edges are what let readiness measure
# build-vs-blueprint (implementation_coverage) and architecture drift
# (architecture_conformance). `confidence` follows the Graphify audit trail:
# EXTRACTED (explicit tag, 1.0) | INFERRED (name/context match) | AMBIGUOUS (review).
bridge_relations:
  implements: { from: code, to: spec, source: "@implements tag",     description: "Code node realizes a spec ID" }
  verifies:   { from: code, to: spec, source: "@verifies / TEST- ref", description: "Test node checks a spec ID" }
  references: { from: code, to: spec, source: "@see tag",            description: "Code node relates to a spec ID without implementing it" }
  violates:   { from: code, to: spec, source: "conformance diff",     description: "Code node breaks an ARC- rule (architecture drift)" }

# --- Required Cross-Reference Edges (schema contract, U2) ---
# Opt-in SEMANTIC validation, the enforcement half of "if it's not in the graph
# it isn't true". Where validate-ids.sh checks structure (dangling/orphan/dup),
# scripts/validate-edges.py checks that each entry of a `from` prefix carries the
# edges its type requires. Turns the ID registry from a convention into a checked
# contract (P12). Schema: docs/DEVELOPMENT_GRAPH.md §14.
#
#   direction: outbound (default) — the `from` entry's body must reference a
#              `requires` ID (e.g. a UJ lists its screens).
#              inbound  — a `requires` entry must reference the `from` one
#              (e.g. a TEST- points back at the API-/BR- it covers).
#   severity:  warn (report, non-fatal) | block (fails the gate, exit 1).
#
# Left EMPTY by default so the methodology template validates clean — a template
# has no real graph to constrain. A real product enables the rules matching its
# conventions. Recommended starter set (uncomment and tune):
#
# required_edges:
#   - { from: API, requires: TEST, direction: inbound,  severity: warn,  description: "Every endpoint needs a declared test (rule 04: Tests First)" }
#   - { from: BR,  requires: TEST, direction: inbound,  severity: warn,  description: "Every business rule needs a verifying test" }
#   - { from: UJ,  requires: SCR,  direction: outbound, severity: warn,  description: "A user journey must map to at least one screen" }
#   - { from: SCR, requires: UJ,   direction: outbound, severity: warn,  description: "A screen must belong to a user journey" }
required_edges: []

